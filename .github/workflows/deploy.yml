name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Configure Pages first, and before the build rather than after it. It is
      # the step that fails when the repository has no Pages site yet ("Get
      # Pages site failed"), and there is no sense spending a full install and
      # build only to fall over on a repo setting. `enablement: true` creates
      # the site over the API instead of requiring a visit to Settings, which
      # is what makes this workflow work on a fresh clone of the repo.
      #
      # Note this cannot help a *private* repo on GitHub Free: Pages only
      # publishes from private repositories on Pro, Team or Enterprise. There
      # the fix is to make the repo public (Settings -> General -> Danger
      # Zone), not to change anything here.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
